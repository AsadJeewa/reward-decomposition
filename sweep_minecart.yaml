program: sweep_minecart.py

method: grid

metric:
  name: eval/hypervolume
  goal: maximize

parameters:
  env_id:
    value: minecart-v0

  env_is_discrete:
    value: true

  total_timesteps:
    value: 5000000

  learning_rate:
    values: [0.0001, 0.0003]

  num_rollout_steps:
    values: [128, 256]

  update_epochs:
    values: [5, 10]

  seed:
    values: [1, 2]

  gamma:
    value: 0.995