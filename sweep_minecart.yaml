program: sweep.py

method: grid

metric:
  name: eval/HV
  goal: maximize

parameters:
  env_id:
    value: minecart-v0

  env_is_discrete:
    value: true

  total_timesteps:
    value: 500000

parameters:
  learning_rate:
    values: [0.0001, 0.0003]

  diversity_scale:
    values: [0.05, 0.1]

  entropy_loss_coefficient:
    values: [0.01, 0.05]

  gamma:
    value: 0.995